  <style>

    main{min-height:0;position:relative}.workspace{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;position:relative;overflow:hidden}

    .world:after{content:"";position:absolute;inset:-120%;pointer-events:none;background-image:radial-gradient(rgba(55,48,36,.15) .75px,transparent .75px);background-size:24px 24px}
    .role-label{position:absolute;top:18px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#827a6c;z-index:2}.role-label.cause{left:18px}.role-label.effect{right:18px}

    .structural-drag .magnet-target,.structural-drag .edge-target{opacity:0}.magnet-target.active,.edge-target.active{z-index:25;opacity:1;border-color:#918b82;background:rgba(235,232,226,.94);box-shadow:0 8px 22px rgba(55,49,42,.12);transform:scale(1.02)}.magnet-target.active:after,.edge-target.active:after{content:attr(data-drop-label);font-size:11px;font-weight:850;color:#5d574f;letter-spacing:.01em}
    .central-target{top:48%}.central-target.cause-target{left:50%;transform:translate(calc(-100% - 118px),-50%)}.central-target.effect-target{left:50%;transform:translate(118px,-50%)}.central-target.cause-target.active{transform:translate(calc(-100% - 118px),-50%) scale(1.02)}.central-target.effect-target.active{transform:translate(118px,-50%) scale(1.02)}

    .selection-bar{z-index:45;min-height:72px;width:100%;display:grid;grid-template-columns:minmax(150px,1fr) minmax(180px,1.35fr) auto minmax(180px,1.2fr) auto auto;align-items:center;gap:8px;padding:10px 14px max(10px,env(safe-area-inset-bottom));background:rgba(251,249,243,.97);border-top:1px solid rgba(45,42,36,.14);box-shadow:0 -10px 30px rgba(49,40,29,.08);backdrop-filter:blur(16px)}.selection-bar.empty{grid-template-columns:1fr}.selection-empty{font-size:12px;color:#777064;text-align:center}.selection-bar input{min-width:0;border:1px solid rgba(45,42,36,.18);border-radius:11px;padding:9px 10px;background:#fff}.selection-info{min-width:0}.selection-info strong{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#756e62}.selection-info span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:750}.bar-btn{border:1px solid rgba(45,42,36,.16);background:#fff;border-radius:11px;padding:9px 11px;cursor:pointer;white-space:nowrap}.bar-btn.primary{background:#2f2c28;color:#fff;border-color:#2f2c28}.bar-btn.danger{color:#a33832}.bar-btn:disabled{opacity:.35;cursor:not-allowed}.side-select{display:flex;background:#e8e3d8;padding:3px;border-radius:11px}.side-select button{border:0;background:transparent;padding:7px 9px;border-radius:8px;font-size:10px;cursor:pointer}.side-select button.active{background:#fff;box-shadow:0 2px 7px rgba(45,38,28,.12)}
    .selection-bar,.selection-bar.empty{grid-template-columns:minmax(160px,1fr) minmax(240px,2fr) auto auto auto auto auto}.selection-status{min-width:0}.selection-status strong{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#756e62}.selection-status span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:750}.mode-field{display:flex;min-width:0}.mode-field input{flex:1;border-radius:11px 0 0 11px}.mode-field .bar-btn{border-radius:0 11px 11px 0;margin-left:-1px}.quick-cause{background:#fff4e6;border-color:#eab66f}.quick-consequence{background:#ecf8e4;border-color:#9dce85}.selection-tool.active{background:#eeeaff;border-color:var(--purple);color:#4d3fb7}.mode-cancel{padding-inline:8px}
    .state-toggle{position:absolute;z-index:34;left:12px;bottom:18px;border:1px solid rgba(45,42,36,.14);background:rgba(255,255,255,.88);border-radius:12px;padding:8px 10px;font-size:10px;font-weight:800;cursor:pointer}
    .inspector{position:absolute;z-index:60;left:12px;bottom:66px;width:min(350px,calc(100vw - 330px));max-height:44vh;background:rgba(35,32,29,.95);color:#f4efe6;border-radius:16px;box-shadow:0 16px 36px rgba(0,0,0,.28);overflow:hidden;display:none}.inspector.open{display:block}.inspector-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.12);font-size:11px}.inspector pre{margin:0;padding:12px;font:10px/1.45 ui-monospace,SFMono-Regular,monospace;overflow:auto;max-height:36vh;white-space:pre-wrap}

    @media(pointer:coarse){.soft-btn,.icon-btn,.bar-btn,.state-toggle,.switcher button{min-height:44px}}
    @media(max-width:860px){header{padding:8px 9px;gap:8px}.prototype-tag,.title span{display:none}.mark{width:32px;height:32px}.soft-btn{padding:8px 10px}.node{width:150px;min-height:62px;padding:10px}.node.center{width:174px;min-height:76px}.magnet-target,.edge-target{width:150px;height:78px}.variant-copy{top:7px;max-width:88vw}.gesture-hint,.role-label{display:none}.switcher{bottom:10px}.switcher .variant-label{min-width:126px}.inspector{width:calc(100vw - 24px);max-height:36vh}.selection-bar,.selection-bar.empty{grid-template-columns:1fr auto auto;gap:7px}.selection-status,.mode-field{grid-column:1/-1}.selection-bar input{width:100%}.bar-btn{padding:9px}.state-toggle{bottom:66px}}

<body>
  <div class="app">
    <header>
      <div class="mark">↳</div>
      <div class="title"><strong id="documentTitle">Volunteer onboarding is confusing</strong><span>Magnetic tree interaction study</span></div>
      <span class="prototype-tag">THROWAWAY PROTOTYPE</span>
      <div class="header-actions"><button class="icon-btn" id="undoBtn" title="Undo">↶</button><button class="soft-btn" id="resetBtn">Reset</button></div>
    </header>
    <main>
      <section class="workspace" id="workspace">
        <div class="canvas" id="canvas">
          <div class="world" id="world">
            <div class="role-label cause">Causes</div><div class="role-label effect">Consequences</div><div class="center-line"></div>
            <svg class="edges" id="edges"></svg>
            <div id="edgeTargets"></div><div id="nodes"></div>
            <div class="magnet-target central-target cause-target" data-drop-type="central" data-side="cause" data-drop-label="Attach as cause"></div>
            <div class="magnet-target central-target effect-target" data-drop-type="central" data-side="consequence" data-drop-label="Attach as consequence"></div>
          </div>
          <div class="variant-copy" id="variantCopy"></div><div class="gesture-hint">Two-finger scroll to pan · pinch to zoom</div>
          <button class="state-toggle" id="stateToggle">State ↗</button>
          <aside class="inspector" id="inspector"><div class="inspector-head"><strong>Prototype state</strong><button class="icon-btn" id="closeInspector">×</button></div><pre id="stateView"></pre></aside>
          <div class="toast" id="toast"></div>
          <nav class="switcher" aria-label="Magnetic strength variants"><button id="prevVariant" aria-label="Previous variant">←</button><div class="variant-label" id="variantLabel"></div><button id="nextVariant" aria-label="Next variant">→</button></nav>
        </div>
        <section class="selection-bar empty" id="selectionBar" aria-label="Selected node actions"><div class="selection-empty">Select a node to rename it, add a branch, or remove it.</div></section>
      </section>
    </main>
  </div>
  <script>
  // THROWAWAY PROTOTYPE: test selection-first editing and constraint-assisted tree layout.
  (() => {
    const variants={
      A:{name:'Magnetic tree',strength:.52,copy:'<strong>Recommended.</strong> Looser spacing and a gentler pull after each drop.'},
      B:{name:'Loose magnets',strength:.28,copy:'<strong>More manual.</strong> A light nudge toward the causal chain with generous spacing.'},
      C:{name:'Tidy magnets',strength:.76,copy:'<strong>More automatic.</strong> Stronger alignment without fully locking the layout.'}
    };
    const initialNodes=[
      {id:'center',text:'Volunteer onboarding is confusing',x:50,y:48,parent:null,side:'center',tilt:-1},
      {id:'cause1',text:'Responsibilities are unclear',x:30,y:48,parent:'center',side:'cause',tilt:-1.5},
      {id:'cause2',text:'No shared checklist exists',x:10,y:48,parent:'cause1',side:null,tilt:1},
      {id:'effect1',text:'Tasks get duplicated',x:70,y:48,parent:'center',side:'consequence',tilt:1.2},
      {id:'effect2',text:'People lose motivation',x:90,y:48,parent:'effect1',side:null,tilt:-.8}
    ];
    let nodes=structuredClone(initialNodes),undoStack=[],pendingDrag=null,drag=null,selectedId=null,selectedIds=new Set(),editorMode={type:'rename'},marquee=null,marqueeTool=false,suppressCanvasClick=false,lastAction='Prototype loaded',camera={x:0,y:0,zoom:1};
    let variant=(new URLSearchParams(location.search).get('variant')||'A').toUpperCase();if(!variants[variant])variant='A';
    const workspace=document.querySelector('#workspace'),canvas=document.querySelector('#canvas'),world=document.querySelector('#world'),nodesEl=document.querySelector('#nodes'),edgesEl=document.querySelector('#edges'),edgeTargetsEl=document.querySelector('#edgeTargets');
    const selectionBar=document.querySelector('#selectionBar'),toastEl=document.querySelector('#toast'),stateView=document.querySelector('#stateView'),inspector=document.querySelector('#inspector');
    const touches=new Map();let touchGesture=null;
    const byId=id=>nodes.find(n=>n.id===id),childrenOf=id=>nodes.filter(n=>n.parent===id);
    const selectOnly=id=>{selectedId=id;selectedIds=new Set(id?[id]:[]);editorMode={type:'rename'}};
    const descendantsOf=id=>{const out=[];const walk=p=>childrenOf(p).forEach(c=>{out.push(c);walk(c.id)});walk(id);return out};
    const rootRole=id=>{let n=byId(id),seen=new Set();while(n&&n.parent){if(seen.has(n.id))return'invalid';seen.add(n.id);if(n.parent==='center')return n.side||'invalid';n=byId(n.parent)}return n?.id==='center'?'center':'invalid'};
    const snapshot=()=>structuredClone(nodes),escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function flash(message){toastEl.textContent=message;toastEl.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>toastEl.classList.remove('show'),1400)}
    function commit(before,label,animateIds=[],originRects={}){if(JSON.stringify(before)===JSON.stringify(nodes))return;undoStack.push(before);if(undoStack.length>30)undoStack.shift();lastAction=label;render(animateIds,originRects);flash(label)}
    function validParent(id,target){return id!==target&&target!=='center'&&!descendantsOf(id).some(n=>n.id===target)}
    function attach(id,target,side){const n=byId(id);if(!n)return false;if(target==='center'){n.parent='center';n.side=side}else if(validParent(id,target)){n.parent=target;n.side=null}else return false;return true}
    function rotateMovedSubtree(id,before,oldDescendantIds,oldRole){const root=byId(id),oldRoot=before.find(n=>n.id===id),newRole=rootRole(id);if(!root||!oldRoot||oldRole===newRole||!['cause','consequence'].includes(oldRole)||!['cause','consequence'].includes(newRole))return[];const oldById=new Map(before.map(n=>[n.id,n]));oldDescendantIds.forEach(childId=>{const child=byId(childId),old=oldById.get(childId);if(child&&old){child.x=root.x-(old.x-oldRoot.x);child.y=root.y-(old.y-oldRoot.y)}});return oldDescendantIds}
    function removeNode(id){const n=byId(id);if(!n||id==='center')return false;const formerParent=n.parent,formerSide=n.side,promoted=childrenOf(id).map(child=>child.id);childrenOf(id).forEach(child=>{child.parent=formerParent;child.side=formerParent==='center'?formerSide:null});nodes=nodes.filter(node=>node.id!==id);return{formerParent,promoted}}
    function insertEdge(id,parentId,childId){if(id===parentId||id===childId||descendantsOf(id).some(n=>n.id===parentId||n.id===childId))return false;const n=byId(id),child=byId(childId);if(!n||!child||child.parent!==parentId)return false;const side=parentId==='center'?child.side:null;n.parent=parentId;n.side=side;child.parent=id;child.side=null;return true}
    const attachedNodes=()=>nodes.filter(n=>n.id==='center'||n.parent);
    function depthOf(id){let depth=0,n=byId(id),seen=new Set();while(n&&n.parent){if(seen.has(n.id))break;seen.add(n.id);depth++;n=byId(n.parent)}return depth}
    function layoutTargets(){
      const targets={center:{x:50,y:48}};
      for(const side of ['cause','consequence']){const roots=childrenOf('center').filter(n=>n.side===side).sort((a,b)=>(a.y??48)-(b.y??48)),leaves=[];
        const collect=id=>{const kids=childrenOf(id);if(!kids.length)leaves.push(id);else kids.sort((a,b)=>(a.y??48)-(b.y??48)).forEach(k=>collect(k.id))};roots.forEach(r=>collect(r.id));
        const spacing=Math.max(16,Math.min(25,84/Math.max(canvas.clientHeight,380)*100+6)),horizontalStep=Math.max(23,242/Math.max(canvas.clientWidth,360)*100),start=48-Math.max(leaves.length-1,0)*spacing/2,leafY=Object.fromEntries(leaves.map((id,i)=>[id,start+i*spacing]));
        const place=id=>{const kids=childrenOf(id);let y;if(!kids.length)y=leafY[id]??48;else{kids.forEach(k=>place(k.id));y=kids.reduce((sum,k)=>sum+targets[k.id].y,0)/kids.length}const depth=depthOf(id);targets[id]={x:50+(side==='cause'?-1:1)*depth*horizontalStep,y};return y};roots.forEach(r=>place(r.id));
      }
      return targets;
    }
    function cardSize(id){const el=nodesEl.querySelector('[data-id="'+id+'"]');return{w:el?.offsetWidth||(id==='center'?210:174),h:el?.offsetHeight||(id==='center'?86:68)}}
    function localNeighborhood(focusIds){
      const list=attachedNodes(),active=new Set(),focus=(Array.isArray(focusIds)?focusIds:[focusIds]).filter(Boolean);
      focus.forEach(id=>{if(byId(id)?.parent||id==='center'){active.add(id);descendantsOf(id).forEach(n=>active.add(n.id))}});
      if(!focus.length)list.forEach(n=>active.add(n.id));
      const w=Math.max(canvas.clientWidth,1),h=Math.max(canvas.clientHeight,1);
      let grew=true;while(grew){grew=false;for(const candidate of list){if(active.has(candidate.id)||candidate.id==='center')continue;const siblingNear=[...active].some(id=>{const current=byId(id);return current&&current.parent===candidate.parent&&Math.abs((current.x-candidate.x)*w/100)<260&&Math.abs((current.y-candidate.y)*h/100)<145});if(siblingNear){active.add(candidate.id);descendantsOf(candidate.id).forEach(n=>active.add(n.id));grew=true}}}
      return active;
    }
    function separateLocalOverlaps(active){
      const list=attachedNodes(),w=Math.max(canvas.clientWidth,1),h=Math.max(canvas.clientHeight,1),gap=10;
      for(let pass=0;pass<20;pass++){let changed=false;for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){const a=list[i],b=list[j];if(!active.has(a.id)&&!active.has(b.id))continue;const as=cardSize(a.id),bs=cardSize(b.id),dx=(b.x-a.x)*w/100,dy=(b.y-a.y)*h/100,ox=(as.w+bs.w)/2+gap-Math.abs(dx),oy=(as.h+bs.h)/2+gap-Math.abs(dy);if(ox<=0||oy<=0)continue;
          let mover;if(a.id==='center')mover=b;else if(b.id==='center')mover=a;else if(active.has(a.id)&&!active.has(b.id))mover=a;else mover=b;active.add(mover.id);descendantsOf(mover.id).forEach(n=>active.add(n.id));
          if(oy<=ox)mover.y+=(mover===b?(dy>=0?1:-1):(dy>=0?-1:1))*oy/h*100;else mover.x+=(mover===b?(dx>=0?1:-1):(dx>=0?-1:1))*ox/w*100;changed=true}if(!changed)break}
      return active;
    }
    function settleTree(focusIds=null){const targets=layoutTargets(),strength=variants[variant].strength,active=localNeighborhood(focusIds);attachedNodes().forEach(n=>{if(!active.has(n.id))return;const t=targets[n.id];if(!t||n.id==='center')return;n.x=(n.x??t.x)*(1-strength)+t.x*strength;n.y=(n.y??t.y)*(1-strength)+t.y*strength});return[...separateLocalOverlaps(active)]}
    function nodeCenter(id){const el=nodesEl.querySelector('[data-id="'+id+'"]');if(!el)return null;const r=el.getBoundingClientRect(),wr=world.getBoundingClientRect();return{x:(r.left+r.width/2-wr.left)/camera.zoom,y:(r.top+r.height/2-wr.top)/camera.zoom}}
    function drawEdges(){
